name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rolling
      - name: Fix workspace permissions for gcov
        run: chmod -R 777 $GITHUB_WORKSPACE
      - name: Setup ROS 2
        uses: ros-tooling/setup-ros@0.7.15
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.5
        with:
          package-name: easynav_common easynav_controller easynav_core easynav_interfaces easynav_localizer easynav_maps_manager easynav_planner easynav_sensors easynav_system easynav_support_py easynav_tools
          target-ros2-distro: rolling
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/.github/thirdparty.repos
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
      - name: Debug coverage
        run: |
          echo "=== .gcno files (exist if build was instrumented) ==="
          find $GITHUB_WORKSPACE/ros_ws -name "*.gcno" | head -10
          echo "=== .gcda files (exist if tests wrote coverage) ==="
          find $GITHUB_WORKSPACE/ros_ws -name "*.gcda" | head -30
          echo "=== CMake CXX flags for easynav_sensors ==="
          grep -r "CXX_FLAGS\|coverage" $GITHUB_WORKSPACE/ros_ws/build/easynav_sensors/CMakeCache.txt 2>/dev/null | head -20 || echo "CMakeCache not found"
          echo "=== easynav_sensors build dir permissions ==="
          ls -la $GITHUB_WORKSPACE/ros_ws/build/easynav_sensors/ | head -10
          echo "=== coverage.info sizes ==="
          find $GITHUB_WORKSPACE/ros_ws -name "coverage.info" -exec wc -l {} \;
      - name: Codecov
        uses: codecov/codecov-action@v5.5.3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          slug: fmrico/EasyNavigation
          name: codecov-umbrella
          fail_ci_if_error: false
